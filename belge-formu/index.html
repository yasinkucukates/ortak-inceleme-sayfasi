<!doctype html>
<html lang="tr" data-sivi="krem">
<head>
<meta charset="utf-8">

<title>Belge ve Bilgi Formu</title>
<style>
:root {
  color-scheme: light;
  --zemin-0: #f7f4ee;
  --zemin-1: #fffdf9;
  --murekkep: #1d1d1f;
  --murekkep-2: #3a3a3c;
  --soluk: #5b5b60;
  --vurgu: #7c562c;
  --hata: #b42318;
  --hata-zemin: rgba(180, 35, 24, .08);
  --sivi-yuzey: 255, 253, 249;
  --sivi-kenar: rgba(60, 40, 20, .14);
  --sivi-kenar-guclu: rgba(60, 40, 20, .24);
  --sivi-spekular: rgba(255, 250, 240, .96);
  --sivi-halka-1: rgba(255, 252, 244, .92);
  --sivi-halka-2: rgba(255, 246, 232, .35);
  --sivi-parilti: rgba(255, 250, 242, .62);
  --sivi-ortam:
    radial-gradient(62% 52% at 14% 12%, rgba(212, 165, 116, .20), transparent 62%),
    radial-gradient(54% 48% at 88% 18%, rgba(164, 185, 196, .16), transparent 60%),
    radial-gradient(60% 52% at 52% 96%, rgba(186, 152, 114, .14), transparent 66%);
  --golge: 0 18px 46px -16px rgba(60, 40, 20, .18), 0 4px 12px -4px rgba(60, 40, 20, .09);
  --odak: #0050d8;
  --sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", system-ui, sans-serif;
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, serif;
}
html[data-sivi="koyu"] {
  color-scheme: dark;
  --zemin-0: #111214;
  --zemin-1: #1e2126;
  --murekkep: #f2f2f4;
  --murekkep-2: #d6d6db;
  --soluk: #a6a6ad;
  --vurgu: #dfb27c;
  --hata: #f08a7e;
  --hata-zemin: rgba(240, 138, 126, .14);
  --sivi-yuzey: 30, 33, 38;
  --sivi-kenar: rgba(255, 255, 255, .14);
  --sivi-kenar-guclu: rgba(255, 255, 255, .26);
  --sivi-spekular: rgba(255, 255, 255, .22);
  --sivi-halka-1: rgba(255, 255, 255, .28);
  --sivi-halka-2: rgba(255, 255, 255, .07);
  --sivi-parilti: rgba(255, 255, 255, .06);
  --sivi-ortam:
    radial-gradient(60% 50% at 14% 12%, rgba(212, 165, 116, .11), transparent 62%),
    radial-gradient(52% 48% at 88% 18%, rgba(114, 152, 184, .12), transparent 60%),
    radial-gradient(58% 50% at 50% 96%, rgba(186, 146, 98, .09), transparent 64%);
  --golge: 0 22px 54px -14px rgba(0, 0, 0, .62), 0 6px 16px -4px rgba(0, 0, 0, .42);
  --odak: #a9c1ff;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  font: 14.5px/1.6 var(--sans);
  color: var(--murekkep);
  background-color: var(--zemin-0);
  background-image: var(--sivi-ortam);
  background-attachment: fixed;
  display: grid;
  place-items: center;
  padding: 24px;
  -webkit-font-smoothing: antialiased;
}
.gate-card {
  position: relative;
  width: 100%;
  max-width: 420px;
  padding: 32px 30px 28px;
  border-radius: 22px;
  border: 1px solid var(--sivi-kenar);
  background-color: rgba(var(--sivi-yuzey), .82);
  background-image: linear-gradient(180deg, var(--sivi-parilti), transparent 56px);
  -webkit-backdrop-filter: blur(24px) saturate(1.7);
  backdrop-filter: blur(24px) saturate(1.7);
  box-shadow: inset 0 1px 0 var(--sivi-spekular), var(--golge);
}
.gate-card::before {
  content: "";
  position: absolute;
  inset: 0;
  border-radius: inherit;
  padding: 1px;
  pointer-events: none;
  background: linear-gradient(135deg, var(--sivi-halka-1), var(--sivi-halka-2) 38%, transparent 65%, var(--sivi-halka-2));
  -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  -webkit-mask-composite: xor;
  mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
  mask-composite: exclude;
}
.gate-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 18px;
}
.gate-badge {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--vurgu);
}
.theme-pill {
  min-height: 30px;
  padding: 4px 12px;
  border-radius: 999px;
  border: 1px solid var(--sivi-kenar);
  background: rgba(var(--sivi-yuzey), .68);
  color: var(--murekkep-2);
  font: 500 12px var(--sans);
  cursor: pointer;
}
.theme-pill:hover { border-color: var(--sivi-kenar-guclu); color: var(--murekkep); }
h1 {
  margin: 0 0 8px;
  font-family: var(--serif);
  font-size: 25px;
  font-weight: 600;
  letter-spacing: -0.02em;
  line-height: 1.2;
}
.gate-desc {
  margin: 0 0 22px;
  font-size: 13.8px;
  color: var(--soluk);
  text-align: justify;
  text-align-last: left;
  hyphens: auto;
  -webkit-hyphens: auto;
}
.field-label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--murekkep-2);
  margin-bottom: 7px;
}
.pw-row {
  position: relative;
  display: flex;
  align-items: center;
}
.pw-input {
  width: 100%;
  min-height: 48px;
  padding: 10px 72px 10px 15px;
  border-radius: 13px;
  border: 1px solid var(--sivi-kenar);
  background: var(--zemin-1);
  color: var(--murekkep);
  font: 500 16px var(--sans);
  letter-spacing: 0.06em;
  outline: none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.pw-input:focus {
  border-color: var(--odak);
  box-shadow: 0 0 0 3px rgba(0, 80, 216, .14);
}
.pw-toggle {
  position: absolute;
  right: 8px;
  min-height: 30px;
  padding: 4px 10px;
  border-radius: 9px;
  border: 0;
  background: transparent;
  color: var(--soluk);
  font: 500 12px var(--sans);
  cursor: pointer;
}
.pw-toggle:hover { color: var(--murekkep); }
.submit-btn {
  width: 100%;
  margin-top: 14px;
  min-height: 44px;
  padding: 10px 18px;
  border-radius: 999px;
  border: 1px solid transparent;
  background: var(--murekkep);
  color: var(--zemin-1);
  font: 600 14px var(--sans);
  cursor: pointer;
  transition: opacity 140ms ease, transform 120ms ease;
}
.submit-btn:hover { opacity: 0.9; }
.submit-btn:active { transform: scale(0.99); }
.submit-btn:disabled { opacity: 0.55; cursor: wait; }
.msg {
  margin: 14px 0 0;
  min-height: 20px;
  font-size: 13px;
  color: var(--soluk);
  text-align: center;
}
.msg.is-err {
  color: var(--hata);
  background: var(--hata-zemin);
  padding: 9px 12px;
  border-radius: 11px;
  font-weight: 500;
}
.gate-foot {
  margin-top: 20px;
  padding-top: 14px;
  border-top: 1px solid var(--sivi-kenar);
  font-size: 11.8px;
  color: var(--soluk);
  text-align: center;
}
.app-frame {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  border: 0;
  background: var(--zemin-0);
}
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>
<main class="gate-card" id="gate" aria-label="Şifreli Form Girişi">
  <div class="gate-top">
    <span class="gate-badge">Şifreli Form</span>
    <button type="button" class="theme-pill" id="btn-theme" aria-pressed="false">Koyu</button>
  </div>
  <h1>Belge ve Bilgi Formu</h1>
  <p class="gate-desc">Bu form uçtan uca şifrelenmiştir. Formu tarayıcınızda yerel olarak açmak ve yanıtlarınızı kaydetmek için erişim şifresini girin.</p>
  <form id="unlock-form" autocomplete="off">
    <label class="field-label" for="pw">Erişim Şifresi</label>
    <div class="pw-row">
      <input type="password" id="pw" class="pw-input" placeholder="Şifreyi yazın" autocomplete="current-password" required autofocus>
      <button type="button" class="pw-toggle" id="btn-eye" aria-label="Şifreyi göster">Göster</button>
    </div>
    <button type="submit" class="submit-btn" id="btn-go">Formu Aç</button>
    <div class="msg" id="msg" role="alert" aria-live="polite"></div>
  </form>
  <div class="gate-foot">AES-256-GCM · Çözümleme yalnız tarayıcınızda yapılır</div>
</main>

<script>
(function() {
  function safeGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
  function safeSet(k, v) { try { localStorage.setItem(k, v); } catch {} }
  const root = document.documentElement;
  const themeBtn = document.getElementById('btn-theme');
  if (safeGet('sivi_tema_mod') === 'koyu') {
    root.setAttribute('data-sivi', 'koyu');
    themeBtn.textContent = 'Krem';
    themeBtn.setAttribute('aria-pressed', 'true');
  }
  themeBtn.addEventListener('click', () => {
    const isDark = root.getAttribute('data-sivi') === 'koyu';
    root.setAttribute('data-sivi', isDark ? 'krem' : 'koyu');
    safeSet('sivi_tema_mod', isDark ? 'krem' : 'koyu');
    themeBtn.textContent = isDark ? 'Koyu' : 'Krem';
    themeBtn.setAttribute('aria-pressed', String(!isDark));
  });

  const pwEl = document.getElementById('pw');
  const eyeBtn = document.getElementById('btn-eye');
  const msgEl = document.getElementById('msg');
  const goBtn = document.getElementById('btn-go');
  const form = document.getElementById('unlock-form');

  eyeBtn.addEventListener('click', () => {
    const show = pwEl.type === 'password';
    pwEl.type = show ? 'text' : 'password';
    eyeBtn.textContent = show ? 'Gizle' : 'Göster';
    pwEl.focus();
  });

  function normPw(s) {
    return s.replace(/\s+/g, '').normalize('NFC').toLocaleUpperCase('tr-TR');
  }
  function b64ToBytes(s) {
    const bin = atob(s);
    const out = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function b64UrlToBytes(s) {
    const clean = s.replace(/-/g, '+').replace(/_/g, '/');
    const pad = clean.length % 4 === 0 ? '' : '='.repeat(4 - (clean.length % 4));
    return b64ToBytes(clean + pad);
  }

  let rawHash = '';
  function syncHash() {
    rawHash = (location.hash || '').slice(1).trim();
    if (!rawHash) {
      msgEl.textContent = 'Bu form yalnız tam paylaşım bağlantısı ve erişim şifresiyle açılır.';
      msgEl.className = 'msg is-err';
      goBtn.disabled = true;
      pwEl.disabled = true;
    } else {
      msgEl.textContent = '';
      msgEl.className = 'msg';
      goBtn.disabled = false;
      pwEl.disabled = false;
      pwEl.focus();
    }
  }
  syncHash();
  window.addEventListener('hashchange', syncHash);

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const entered = pwEl.value || '';
    if (!entered.trim()) {
      msgEl.textContent = 'Lütfen erişim şifresini girin.';
      msgEl.className = 'msg is-err';
      pwEl.focus();
      return;
    }
    goBtn.disabled = true;
    msgEl.textContent = 'Doğrulanıyor ve açılıyor...';
    msgEl.className = 'msg';
    try {
      const urlBytes = b64UrlToBytes(rawHash);
      const pwBytes = new TextEncoder().encode(normPw(entered));
      const keyMat = new Uint8Array(urlBytes.length + 1 + pwBytes.length);
      keyMat.set(urlBytes, 0);
      keyMat[urlBytes.length] = 0x3a;
      keyMat.set(pwBytes, urlBytes.length + 1);

      const blobBytes = b64ToBytes(document.getElementById('enc-blob').textContent.trim());
      const salt = blobBytes.slice(0, 16);
      const iv = blobBytes.slice(16, 28);
      const ct = blobBytes.slice(28);

      const baseKey = await crypto.subtle.importKey('raw', keyMat, 'PBKDF2', false, ['deriveKey']);
      const aesKey = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 210000, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      const plainBuf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, aesKey, ct);
      const htmlStr = new TextDecoder().decode(plainBuf);
      pwEl.value = '';

      const parsed = new DOMParser().parseFromString(htmlStr, 'text/html');
      if (parsed && parsed.title) document.title = parsed.title;
      const frame = document.createElement('iframe');
      frame.className = 'app-frame';
      frame.title = document.title;
      document.body.style.padding = '0';
      document.body.style.display = 'block';
      document.body.replaceChildren(frame);
      frame.srcdoc = htmlStr;
    } catch (err) {
      msgEl.textContent = 'Şifre hatalı veya paylaşım bağlantısı eksik.';
      msgEl.className = 'msg is-err';
      goBtn.disabled = false;
      pwEl.select();
      pwEl.focus();
    }
  });
})();
</script>
